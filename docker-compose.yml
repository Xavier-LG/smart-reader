services:
  smart-reader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-reader
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
